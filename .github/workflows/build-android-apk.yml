name: Build Android APK\n\non:\n  push:\n    branches:\n      - main\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v2\n\n      - name: Set up JDK\n        uses: actions/setup-java@v2\n        with:\n          java-version: '11'\n          distribution: 'adopt'\n\n      - name: Set up Android SDK\n        run: |\n          wget https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip\n          unzip commandlinetools-linux-6609375_latest.zip -d $HOME/Android/sdk/cmdline-tools\n          yes | $HOME/Android/sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android/sdk --licenses\n          $HOME/Android/sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android/sdk "platform-tools" "platforms;android-30"\n\n      - name: Build with Gradle\n        run: ./gradlew assembleRelease\n\n      - name: Upload APK artifact\n        uses: actions/upload-artifact@v2\n        with:\n          name: app-release.apk\n          path: app/build/outputs/apk/release/app-release.apk\n